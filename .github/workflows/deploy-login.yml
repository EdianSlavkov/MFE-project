# Deploys ONLY the login. It runs when something inside login/ changes, so teams ship independently.
name: Deploy login

on:
  push:
    branches: [main]
    paths: ['login/**', '.github/workflows/deploy-login.yml', '.github/scripts/**']
  workflow_dispatch:

# Needed so the job can push the build to the gh-pages branch.
permissions:
  contents: write

# One queue per workflow, so a new deploy of this app waits for the running one instead of racing it.
# Different apps run in parallel. The publish script handles their pushes to gh-pages meeting.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: login
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: login/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Publishes dist into the /login sub folder of the gh-pages branch. Other apps' folders stay untouched.
      - run: ../.github/scripts/publish-gh-pages.sh dist login
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
